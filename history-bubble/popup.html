<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="bubble-container">
    <header class="header">
      <h1 id="title"></h1>
      <button id="clear-btn" class="icon-btn-highlight" title="Clear History">
        <img src="icons/bin.png" alt="clear">

    </header>

    <main id="history-list" class="list-area"></main>

    <footer id="footer" class="footer border-top">

        <span id="footer-text"></span>
        <img src="icons/openinnew.png" class="footer-icon" alt="open">
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
